name: Build macOS App

# 触发方式：
#  1) 手动触发（Actions 页面点 Run workflow）
#  2) 推送 tag（如 v0.1.0）自动构建并创建 Release
#  3) 推送 main 分支时构建（产物存为 artifact）
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build-macos:
    name: Build ${{ matrix.label }}
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Apple Silicon (M 系列)
          - target: aarch64-apple-darwin
            label: Apple-Silicon
          # Intel
          - target: x86_64-apple-darwin
            label: Intel

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
          key: ${{ matrix.target }}

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile

      # 关键：仅当确实配置了签名证书时才传入签名相关环境变量。
      # 传空字符串会让 Tauri 误以为要签名，导致 keychain 导入失败。
      - name: Detect signing secrets
        id: signing
        run: |
          if [ -n "${{ secrets.APPLE_CERTIFICATE }}" ]; then
            echo "enabled=true" >> $GITHUB_OUTPUT
            echo "🔐 检测到签名证书，将启用签名与公证"
          else
            echo "enabled=false" >> $GITHUB_OUTPUT
            echo "🔓 未配置签名证书，构建未签名版本（首次打开需右键→打开）"
          fi

      - name: Build Tauri app with signing
        if: steps.signing.outputs.enabled == 'true'
        run: pnpm tauri build --target ${{ matrix.target }}
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Build Tauri app (unsigned)
        if: steps.signing.outputs.enabled != 'true'
        run: pnpm tauri build --target ${{ matrix.target }}

      - name: List build output
        run: |
          echo "=== bundle 目录 ==="
          find src-tauri/target/${{ matrix.target }}/release/bundle -maxdepth 3 | sort

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: dmg-${{ matrix.label }}
          path: src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
          if-no-files-found: error
          retention-days: 30

      - name: Upload APP bundle
        uses: actions/upload-artifact@v4
        with:
          name: app-${{ matrix.label }}
          path: src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app/**
          if-no-files-found: warn
          retention-days: 30

  # 打 tag 时自动创建 Release 并附上 dmg
  release:
    name: Create Release
    needs: build-macos
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release files
        run: |
          mkdir -p release
          find artifacts -name "*.dmg" -exec cp {} release/ \;
          ls -lh release/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.dmg
          generate_release_notes: true
          draft: false
